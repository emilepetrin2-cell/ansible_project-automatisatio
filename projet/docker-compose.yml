services:
  redis:
    image: redis:7-alpine
    container_name: orchestrator_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: orchestrator_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_DIR=/project
    volumes:
      - .:/project
      - /tmp:/tmp
    depends_on:
      - redis

  celery_worker:
    build: ./backend
    container_name: orchestrator_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_DIR=/project
    volumes:
      - .:/project
      - /tmp:/tmp
    depends_on:
      - redis
      - backend

  frontend:
    build: ./switch-orchestrator
    container_name: orchestrator_frontend
    ports:
      - "80:80"
    depends_on:
      - backend